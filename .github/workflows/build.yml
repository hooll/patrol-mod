name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Show artifact
        run: |
          ls -l build/libs
          sha256sum build/libs/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: patrol-mod
          path: build/libs/*.jar
          if-no-files-found: error
